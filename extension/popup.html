<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="popupTitle">ChatGPT Native Longshot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <h1 data-i18n="popupTitle">ChatGPT Native Longshot</h1>
    <button id="refreshBtn" class="refresh-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 7v5h-5M4 17v-5h5"></path>
        <path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 17.9 17"></path>
      </svg>
      <span data-i18n="btnRefresh">Refresh</span>
    </button>
  </header>

  <details class="background-settings" id="backgroundSettings">
    <summary><span data-i18n="backgroundTitle">Export background</span><span id="backgroundSummary"></span></summary>
    <div class="background-panel">
      <div class="background-image-row">
        <!-- The optional preview stays hidden until background-settings.js assigns a local image. -->
        <img id="backgroundPreview" alt="" hidden>
        <div class="background-image-actions">
          <div class="background-buttons">
            <button type="button" id="chooseBackgroundBtn" data-i18n="backgroundChoose">Choose image</button>
            <button type="button" id="clearBackgroundBtn" data-i18n="backgroundClear" disabled>Restore solid color</button>
          </div>
          <span id="backgroundFileName"></span>
        </div>
      </div>
      <input type="file" id="backgroundFile" accept="image/png,image/jpeg,image/webp" hidden>
      <div class="background-blur-row">
        <label for="backgroundBlur" data-i18n="backgroundBlurLabel">Blur</label>
        <input type="range" id="backgroundBlur" min="0" max="32" step="1" value="16" disabled>
        <output id="backgroundBlurValue" for="backgroundBlur">16px</output>
      </div>
      <p class="background-hint" data-i18n="backgroundHint">Saved locally and reused automatically for future exports.</p>
    </div>
  </details>

  <div class="status-bar" id="statusBar" style="display: none;">
    <div class="view-toggle">
      <button id="viewAllBtn" class="active" aria-pressed="true" data-i18n="viewAll">All</button>
      <button id="viewSelectedBtn" aria-pressed="false" data-i18n="viewSelected">Selected</button>
    </div>
    <span><span data-i18n="labelSelected">Selected</span>: <span class="count" id="selectedCount">0</span></span>
    <div class="select-actions">
      <button id="selectAllBtn" data-i18n="btnSelectAll">Select all</button>
      <button id="deselectAllBtn" data-i18n="btnClear">Clear</button>
      <button id="invertSelectBtn" data-i18n="btnInvert">Invert</button>
    </div>
  </div>

  <main class="preview-container" id="previewContainer">
    <div class="empty-state" id="emptyState">
      <div class="icon">💬</div>
      <h3 data-i18n="emptyLoadingTitle">Loading...</h3>
      <p data-i18n="emptyLoadingDesc">Reading conversation, please wait.</p>
    </div>

    <div id="chatPreview"></div>

    <div class="loading-overlay hidden" id="loadingOverlay">
      <div class="loading-spinner"></div>
      <div class="loading-text" id="loadingText" data-i18n="loadingLoadingMessages">Loading messages...</div>
    </div>
  </main>

  <footer class="footer" id="footer" style="display: none;">
    <div class="footer-hint" data-i18n-html="tipOnlySelectedHtml">
      Tip: only <span class="highlight">selected messages</span> will be included in the exported image.
    </div>
    <div class="footer-actions">
      <div class="control-group">
        <label for="scaleSelect" data-i18n="labelScale">Scale</label>
        <select id="scaleSelect">
          <option value="1">1x</option>
          <option value="2" selected>2x</option>
          <option value="3">3x</option>
        </select>
      </div>
      <button class="btn btn-success" id="copyBtn" disabled>
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </span>
        <span data-i18n="btnCopyImage">Copy image</span>
      </button>
      <button class="btn btn-primary" id="saveBtn" disabled>
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </span>
        <span data-i18n="btnSaveImage">Save image</span>
      </button>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="capture-plan.js"></script>
  <script src="capture-matte.js"></script>
  <script src="background-settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
